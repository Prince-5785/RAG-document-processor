version: '3.8'

services:
  # Caddy Automatic HTTPS Reverse Proxy
  caddy:
    image: caddy:2
    container_name: insurequery-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - insurequery-api
    restart: unless-stopped

  # InsureQuery FastAPI Backend Engine
  insurequery-api:
    build: .
    container_name: insurequery-api
    expose:
      - "8000"
    volumes:
      - insure_data:/app/data
      - hf_cache:/home/app/.cache/huggingface
    environment:
      - APP_ENV=production
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEYS=${GROQ_API_KEYS:-}
      - INSUREQUERY_API_KEY=${INSUREQUERY_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://prince-gupta.me}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Redis Distributed Cache for Embeddings (internal only, no exposed host ports)
  redis:
    image: redis:7-alpine
    container_name: insurequery-redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  insure_data:
  hf_cache:
  redis_data:
  caddy_data:
  caddy_config:
